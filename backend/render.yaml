services:
  - type: web
    name: django-api
    env: python
buildCommand: pip install --no-cache-dir --upgrade pip setuptools wheel && pip install pandas==2.1.4 numpy==1.24.4 scikit-learn==1.3.2 scipy==1.11.4 && pip install -r requirements.txt && python backend/manage.py collectstatic --noinput --clear
    startCommand: gunicorn backend.wsgi:application --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - fromDatabase:
          name: neondb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
    healthCheckPath: /health/
    autoDeploy: false
